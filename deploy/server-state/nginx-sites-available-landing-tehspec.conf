server {

    server_name landing.bestofigor.tech www.landing.bestofigor.tech;
    root /var/www/landing-tehspec;
    index index.html;

    # Лендинг — один файл, никаких роутов: всё, что не найдено, отдаём как 404
    location = / {
        try_files /index.html =404;
    }

    # Картинки меняются редко — пусть браузер держит их месяц
    location ~* \.(png|jpe?g|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Саму страницу не кешируем: правки должны быть видны сразу
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Скрытые файлы наружу не отдаём (.env, .git и прочее)
    location ~ /\. {
        deny all;
        return 404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/javascript application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/landing-access.log;
    error_log  /var/log/nginx/landing-error.log;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/landing.bestofigor.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/landing.bestofigor.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.landing.bestofigor.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = landing.bestofigor.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name landing.bestofigor.tech www.landing.bestofigor.tech;
    return 404; # managed by Certbot




}